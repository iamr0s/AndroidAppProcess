plugins {
    alias(libs.plugins.agp.lib)
    id "maven-publish"
    id "signing"
}

def signingProps = new Properties()
def signingFile = file("${rootDir}/keystore/signing.properties")
if (signingFile.exists()) {
    signingProps.load(signingFile.newInputStream())
}

android {
    namespace = "com.rosan.app_process"
    compileSdk = rootProject.ext.TARGET_SDK

    enableKotlin = false

    defaultConfig {
        minSdk = rootProject.ext.MIN_SDK
        targetSdk = rootProject.ext.TARGET_SDK

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    lint {
        disable += "NewerVersionAvailable"
        disable += "GradleDependency"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    compileOnly project(":hidden-api")

    implementation(libs.commons.cli)
    implementation(libs.hiddenapibypass)
}

afterEvaluate {
    tasks.named('sourceReleaseJar', Jar) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.withType(JavaCompile).configureEach {
    //options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

publishing {
    publications {
        mavenRelease(MavenPublication) {
            afterEvaluate {
                from components.findByName('release')
            }

            group = rootProject.ext.GROUP_ID
            artifactId = rootProject.ext.ARTIFACT_ID
            version = rootProject.ext.ARTIFACT_VERSION

            pom {
                name = rootProject.ext.POM_NAME
                description = rootProject.ext.POM_DESCRIPTION
                inceptionYear = rootProject.ext.POM_INCEPTION_YEAR
                url = rootProject.ext.POM_URL
                scm {
                    url = rootProject.ext.POM_SCM_URL
                    connection = rootProject.ext.POM_SCM_CONNECTION
                }
                licenses {
                    license {
                        name = rootProject.ext.POM_LICENSE_NAME
                        url = rootProject.ext.POM_LICENSE_URL
                    }
                }
                developers {
                    developer {
                        name = rootProject.ext.POM_DEVELOPER_NAME
                        url = rootProject.ext.POM_DEVELOPER_URL
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url = uri(rootProject.layout.buildDirectory.dir("staging").get().asFile)
        }
    }
}

signing {
    if (signingFile.exists() && signingProps['signing.keyId'] != null) {
        def privateKey = signingProps['signing.privateKey']
        if (privateKey == null) {
            privateKey = file(signingProps['signing.secretKeyRingFile']).text
        }
        useInMemoryPgpKeys(
                signingProps['signing.keyId'],
                privateKey,
                signingProps['signing.password']
        )
        sign publishing.publications
    }
}
