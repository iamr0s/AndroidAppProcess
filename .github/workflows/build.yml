name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths-ignore:
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set environment
        run: |
          {
            echo "name=$(grep ARTIFACT_ID build.gradle| awk -F\" '{print $2}')"
            echo "version=v$(grep ARTIFACT_VERSION build.gradle| awk -F\" '{print $2}')"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
          } >> $GITHUB_ENV

      - name: Build
        run: |
          ./gradlew --warning-mode=all assembleDebug
          cp app-process/build/outputs/aar/app-process-debug.aar "${{ env.name }}-${{ env.version }}@${{ env.commit }}.aar"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: "${{ env.name }}-${{ env.version }}@${{ env.commit }}.aar"
